    <script>
        // Xử lý điều hướng
        document.addEventListener('DOMContentLoaded', function () {
            const navLinks = document.querySelectorAll('.nav-link');
            const sections = document.querySelectorAll('.section');

            navLinks.forEach(link => {
                link.addEventListener('click', function (e) {
                    e.preventDefault();

                    // Xóa class active từ tất cả các link và section
                    navLinks.forEach(item => item.classList.remove('active'));
                    sections.forEach(section => section.classList.remove('active'));

                    // Thêm class active cho link được click
                    this.classList.add('active');

                    // Hiển thị section tương ứng
                    const targetId = this.getAttribute('href').substring(1);
                    document.getElementById(targetId).classList.add('active');
                });
            });
        });

        // Hàm copy code
        function copyCode(button) {
            const codeBlock = button.parentElement.parentElement;
            const text = codeBlock.innerText;
            navigator.clipboard.writeText(text).then(() => {
                const originalText = button.textContent;
                button.textContent = 'Đã copy!';
                setTimeout(() => {
                    button.textContent = originalText;
                }, 2000);
            });
        }

        // Thử nghiệm LocalTime
        function testLocalTime() {
            const timeStr = document.getElementById('localtimeInput').value;
            const operation = document.getElementById('localtimeOperation').value;
            const result = document.getElementById('localtimeResult');
            const output = document.getElementById('localtimeResultContent');

            result.classList.add('active');

            try {
                let outputText = '=== KẾT QUẢ LOCALTIME ===\n\n';
                
                switch (operation) {
                    case 'parse':
                        const timeParts = timeStr.split(':');
                        outputText += `Parse từ chuỗi: "${timeStr}"\n`;
                        if (timeParts.length >= 2) {
                            const hour = parseInt(timeParts[0]);
                            const minute = parseInt(timeParts[1]);
                            const second = timeParts.length >= 3 ? parseInt(timeParts[2]) : 0;
                            outputText += `Giờ: ${hour}, Phút: ${minute}, Giây: ${second}\n`;
                            outputText += `Kết quả: ${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}:${second.toString().padStart(2, '0')}\n`;
                        }
                        break;
                        
                    case 'getHour':
                        const hour = parseInt(timeStr.split(':')[0]);
                        outputText += `getHour() từ "${timeStr}"\n`;
                        outputText += `Kết quả: ${hour}\n`;
                        break;
                        
                    case 'getMinute':
                        const minute = parseInt(timeStr.split(':')[1]);
                        outputText += `getMinute() từ "${timeStr}"\n`;
                        outputText += `Kết quả: ${minute}\n`;
                        break;
                        
                    case 'getSecond':
                        const parts = timeStr.split(':');
                        const second = parts.length >= 3 ? parseInt(parts[2]) : 0;
                        outputText += `getSecond() từ "${timeStr}"\n`;
                        outputText += `Kết quả: ${second}\n`;
                        break;
                        
                    case 'constants':
                        outputText += '=== CÁC HẰNG SỐ LOCALTIME ===\n\n';
                        outputText += 'MIN: 00:00 (Thời gian nhỏ nhất)\n';
                        outputText += 'MAX: 23:59:59.999999999 (Thời gian lớn nhất)\n';
                        outputText += 'MIDNIGHT: 00:00 (Nửa đêm)\n';
                        outputText += 'NOON: 12:00 (Buổi trưa)\n';
                        break;
                }
                
                output.textContent = outputText;
            } catch (error) {
                output.textContent = `Lỗi: Định dạng thời gian không hợp lệ. Vui lòng nhập theo định dạng HH:mm hoặc HH:mm:ss`;
            }
        }

        // Thử nghiệm LocalDateTime
        function testLocalDateTime() {
            const dateStr = document.getElementById('localdatetimeDate').value;
            const timeStr = document.getElementById('localdatetimeTime').value;
            const operation = document.getElementById('localdatetimeOperation').value;
            const result = document.getElementById('localdatetimeResult');
            const output = document.getElementById('localdatetimeResultContent');

            result.classList.add('active');

            try {
                const dateParts = dateStr.split('-');
                const timeParts = timeStr.split(':');
                
                if (dateParts.length !== 3 || timeParts.length < 2) {
                    throw new Error('Định dạng không hợp lệ');
                }
                
                const year = parseInt(dateParts[0]);
                const month = parseInt(dateParts[1]);
                const day = parseInt(dateParts[2]);
                const hour = parseInt(timeParts[0]);
                const minute = parseInt(timeParts[1]);
                
                let outputText = '=== KẾT QUẢ LOCALDATETIME ===\n\n';
                
                switch (operation) {
                    case 'create':
                        outputText += `Tạo LocalDateTime từ:\n`;
                        outputText += `- Ngày: ${dateStr}\n`;
                        outputText += `- Giờ: ${timeStr}\n`;
                        outputText += `Kết quả: ${year}-${month.toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}T${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}:00\n`;
                        break;
                        
                    case 'toLocalDate':
                        outputText += `Chuyển thành LocalDate từ:\n`;
                        outputText += `- LocalDateTime: ${year}-${month.toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}T${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}\n`;
                        outputText += `Kết quả (toLocalDate()): ${year}-${month.toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}\n`;
                        break;
                        
                    case 'toLocalTime':
                        outputText += `Chuyển thành LocalTime từ:\n`;
                        outputText += `- LocalDateTime: ${year}-${month.toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}T${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}\n`;
                        outputText += `Kết quả (toLocalTime()): ${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}:00\n`;
                        break;
                        
                    case 'startOfDay':
                        outputText += `Bắt đầu ngày từ:\n`;
                        outputText += `- LocalDate: ${year}-${month.toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}\n`;
                        outputText += `Kết quả (atStartOfDay()): ${year}-${month.toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}T00:00:00\n`;
                        break;
                }
                
                output.textContent = outputText;
            } catch (error) {
                output.textContent = `Lỗi: Định dạng không hợp lệ. Vui lòng nhập:\n- Ngày: yyyy-MM-dd\n- Giờ: HH:mm`;
            }
        }

        // Thử nghiệm chuyển đổi múi giờ
        function testTimezoneConversion() {
            const fromZone = document.getElementById('timezoneFrom').value;
            const toZone = document.getElementById('timezoneTo').value;
            const timeStr = document.getElementById('timezoneTime').value;
            const dateStr = document.getElementById('timezoneDate').value;
            const result = document.getElementById('timezoneResult');
            const output = document.getElementById('timezoneResultContent');

            result.classList.add('active');

            try {
                const dateParts = dateStr.split('-');
                const timeParts = timeStr.split(':');
                
                if (dateParts.length !== 3 || timeParts.length < 2) {
                    throw new Error('Định dạng không hợp lệ');
                }
                
                const year = parseInt(dateParts[0]);
                const month = parseInt(dateParts[1]);
                const day = parseInt(dateParts[2]);
                const hour = parseInt(timeParts[0]);
                const minute = parseInt(timeParts[1]);
                
                // Tính offset đơn giản (cho demo)
                const zoneOffsets = {
                    'Asia/Ho_Chi_Minh': 7,  // UTC+7
                    'America/New_York': -5, // UTC-5
                    'Europe/London': 0,     // UTC+0
                    'Asia/Tokyo': 9         // UTC+9
                };
                
                const fromOffset = zoneOffsets[fromZone] || 0;
                const toOffset = zoneOffsets[toZone] || 0;
                
                // Tính chuyển đổi đơn giản
                let targetHour = hour + (toOffset - fromOffset);
                let targetDay = day;
                let targetMonth = month;
                let targetYear = year;
                
                // Xử lý tràn ngày
                if (targetHour >= 24) {
                    targetHour -= 24;
                    targetDay++;
                    // Xử lý tràn tháng (đơn giản)
                    const daysInMonth = new Date(year, month, 0).getDate();
                    if (targetDay > daysInMonth) {
                        targetDay = 1;
                        targetMonth++;
                        if (targetMonth > 12) {
                            targetMonth = 1;
                            targetYear++;
                        }
                    }
                } else if (targetHour < 0) {
                    targetHour += 24;
                    targetDay--;
                    if (targetDay < 1) {
                        targetMonth--;
                        if (targetMonth < 1) {
                            targetMonth = 12;
                            targetYear--;
                        }
                        targetDay = new Date(targetYear, targetMonth, 0).getDate();
                    }
                }
                
                let outputText = '=== CHUYỂN ĐỔI MÚI GIỜ ===\n\n';
                outputText += `Thời gian gốc:\n`;
                outputText += `- Múi giờ: ${fromZone} (UTC${fromOffset >= 0 ? '+' : ''}${fromOffset})\n`;
                outputText += `- Thời gian: ${year}-${month.toString().padStart(2, '0')}-${day.toString().padStart(2, '0')} ${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}\n\n`;
                
                outputText += `Chuyển sang:\n`;
                outputText += `- Múi giờ: ${toZone} (UTC${toOffset >= 0 ? '+' : ''}${toOffset})\n`;
                outputText += `- Thời gian: ${targetYear}-${targetMonth.toString().padStart(2, '0')}-${targetDay.toString().padStart(2, '0')} ${targetHour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}\n\n`;
                
                outputText += `Phân tích:\n`;
                outputText += `- Độ lệch: ${toOffset - fromOffset} giờ\n`;
                outputText += `- Phương thức: withZoneSameInstant()\n`;
                outputText += `- Kết quả: Giữ nguyên thời điểm trên timeline\n`;
                
                output.textContent = outputText;
            } catch (error) {
                output.textContent = `Lỗi: Định dạng không hợp lệ. Vui lòng kiểm tra lại dữ liệu nhập.`;
            }
        }

        // Thử nghiệm Instant
        function testInstant() {
            const epochSeconds = parseInt(document.getElementById('epochSeconds').value);
            const nanoAdjustment = parseInt(document.getElementById('nanoAdjustment').value);
            const result = document.getElementById('instantResult');
            const output = document.getElementById('instantResultContent');

            result.classList.add('active');

            try {
                // Tính ngày từ epoch seconds
                const milliseconds = epochSeconds * 1000;
                const date = new Date(milliseconds);
                
                let outputText = '=== KẾT QUẢ INSTANT ===\n\n';
                outputText += `Tham số:\n`;
                outputText += `- Số giây từ epoch: ${epochSeconds}\n`;
                outputText += `- Nano adjustment: ${nanoAdjustment}\n\n`;
                
                outputText += `Kết quả:\n`;
                outputText += `- Instant.ofEpochSecond(${epochSeconds}L, ${nanoAdjustment}L)\n`;
                outputText += `- Tương ứng với ngày: ${date.toISOString()}\n`;
                outputText += `- Định dạng ISO: ${date.getUTCFullYear()}-${(date.getUTCMonth() + 1).toString().padStart(2, '0')}-${date.getUTCDate().toString().padStart(2, '0')}T${date.getUTCHours().toString().padStart(2, '0')}:${date.getUTCMinutes().toString().padStart(2, '0')}:${date.getUTCSeconds().toString().padStart(2, '0')}.${nanoAdjustment.toString().padStart(9, '0')}Z\n\n`;
                
                outputText += `Phân tích:\n`;
                outputText += `- Epoch: 1970-01-01T00:00:00Z\n`;
                outputText += `- Instant đại diện cho thời điểm cụ thể trên timeline\n`;
                outputText += `- Luôn ở múi giờ UTC\n`;
                
                output.textContent = outputText;
            } catch (error) {
                output.textContent = `Lỗi: Dữ liệu nhập không hợp lệ. Vui lòng kiểm tra lại.`;
            }
        }

        // Thử nghiệm Period và Duration
        function testPeriodDuration() {
            const periodStartStr = document.getElementById('periodStart').value;
            const periodEndStr = document.getElementById('periodEnd').value;
            const durationStartStr = document.getElementById('durationStart').value;
            const durationEndStr = document.getElementById('durationEnd').value;
            const result = document.getElementById('periodDurationResult');
            const output = document.getElementById('periodDurationResultContent');

            result.classList.add('active');

            try {
                // Parse dates for period
                const periodStartParts = periodStartStr.split('-');
                const periodEndParts = periodEndStr.split('-');
                
                if (periodStartParts.length !== 3 || periodEndParts.length !== 3) {
                    throw new Error('Định dạng ngày không hợp lệ');
                }
                
                const startDate = new Date(periodStartParts[0], periodStartParts[1] - 1, periodStartParts[2]);
                const endDate = new Date(periodEndParts[0], periodEndParts[1] - 1, periodEndParts[2]);
                
                // Parse times for duration
                const durationStartParts = durationStartStr.split(':');
                const durationEndParts = durationEndStr.split(':');
                
                if (durationStartParts.length < 2 || durationEndParts.length < 2) {
                    throw new Error('Định dạng thời gian không hợp lệ');
                }
                
                const startTime = new Date(1970, 0, 1, durationStartParts[0], durationStartParts[1]);
                const endTime = new Date(1970, 0, 1, durationEndParts[0], durationEndParts[1]);
                
                // Tính period
                const diffTime = endDate - startDate;
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                const years = Math.floor(diffDays / 365);
                const months = Math.floor((diffDays % 365) / 30);
                const days = diffDays % 30;
                
                // Tính duration
                const durationMs = endTime - startTime;
                const durationHours = Math.floor(durationMs / (1000 * 60 * 60));
                const durationMinutes = Math.floor((durationMs % (1000 * 60 * 60)) / (1000 * 60));
                
                let outputText = '=== KẾT QUẢ PERIOD VÀ DURATION ===\n\n';
                
                outputText += '=== PERIOD (Khoảng ngày) ===\n';
                outputText += `Period.between(${periodStartStr}, ${periodEndStr})\n`;
                outputText += `- Ngày bắt đầu: ${periodStartStr}\n`;
                outputText += `- Ngày kết thúc: ${periodEndStr}\n`;
                outputText += `- Kết quả: ${years} năm, ${months} tháng, ${days} ngày\n`;
                outputText += `- Tổng số ngày: ${diffDays} ngày\n\n`;
                
                outputText += '=== DURATION (Khoảng thời gian) ===\n';
                outputText += `Duration.between(${durationStartStr}, ${durationEndStr})\n`;
                outputText += `- Bắt đầu: ${durationStartStr}\n`;
                outputText += `- Kết thúc: ${durationEndStr}\n`;
                outputText += `- Kết quả: ${durationHours} giờ ${durationMinutes} phút\n`;
                outputText += `- Định dạng ISO: PT${durationHours}H${durationMinutes}M\n`;
                
                output.textContent = outputText;
            } catch (error) {
                output.textContent = `Lỗi: Định dạng không hợp lệ. Vui lòng kiểm tra:\n- Ngày: yyyy-MM-dd\n- Giờ: HH:mm`;
            }
        }

        // Thử nghiệm DateTimeFormatter
        function testDateTimeFormatter() {
            const pattern = document.getElementById('formatterPattern').value;
            const dateStr = document.getElementById('formatterDate').value;
            const timeStr = document.getElementById('formatterTime').value;
            const operation = document.getElementById('formatterOperation').value;
            const result = document.getElementById('formatterResult');
            const output = document.getElementById('formatterResultContent');

            result.classList.add('active');

            try {
                const dateParts = dateStr.split('-');
                const timeParts = timeStr.split(':');
                
                if (dateParts.length !== 3 || timeParts.length < 2) {
                    throw new Error('Định dạng không hợp lệ');
                }
                
                const year = parseInt(dateParts[0]);
                const month = parseInt(dateParts[1]);
                const day = parseInt(dateParts[2]);
                const hour = parseInt(timeParts[0]);
                const minute = parseInt(timeParts[1]);
                
                let outputText = '=== KẾT QUẢ DATETIMEFORMATTER ===\n\n';
                outputText += `Pattern: "${pattern}"\n\n`;
                
                switch (operation) {
                    case 'format':
                        const dateTime = `${year}-${month.toString().padStart(2, '0')}-${day.toString().padStart(2, '0')} ${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}:00`;
                        outputText += `Định dạng từ:\n`;
                        outputText += `- LocalDateTime: ${dateTime}\n`;
                        outputText += `- Formatter: DateTimeFormatter.ofPattern("${pattern}")\n`;
                        outputText += `Kết quả: ${formatWithPattern(dateTime, pattern)}\n`;
                        break;
                        
                    case 'parseDate':
                        outputText += `Parse ngày từ chuỗi:\n`;
                        outputText += `- Chuỗi: "25/12/2024"\n`;
                        outputText += `- Formatter: DateTimeFormatter.ofPattern("dd/MM/yyyy")\n`;
                        outputText += `Kết quả: 2024-12-25\n`;
                        break;
                        
                    case 'parseDateTime':
                        const inputDateTime = `${day.toString().padStart(2, '0')}/${month.toString().padStart(2, '0')}/${year} ${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`;
                        outputText += `Parse ngày giờ từ chuỗi:\n`;
                        outputText += `- Chuỗi: "${inputDateTime}"\n`;
                        outputText += `- Formatter: DateTimeFormatter.ofPattern("dd/MM/yyyy HH:mm")\n`;
                        outputText += `Kết quả: ${year}-${month.toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}T${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}:00\n`;
                        break;
                }
                
                output.textContent = outputText;
            } catch (error) {
                output.textContent = `Lỗi: Định dạng không hợp lệ. Vui lòng kiểm tra:\n- Pattern định dạng\n- Ngày: yyyy-MM-dd\n- Giờ: HH:mm`;
            }
        }

        // Hàm hỗ trợ định dạng với pattern
        function formatWithPattern(dateTimeStr, pattern) {
            try {
                const [datePart, timePart] = dateTimeStr.split(' ');
                const [year, month, day] = datePart.split('-');
                const [hour, minute, second] = timePart.split(':');
                
                let result = pattern;
                
                // Thay thế các pattern
                result = result.replace(/yyyy/g, year);
                result = result.replace(/MM/g, month.padStart(2, '0'));
                result = result.replace(/dd/g, day.padStart(2, '0'));
                result = result.replace(/HH/g, hour.padStart(2, '0'));
                result = result.replace(/mm/g, minute.padStart(2, '0'));
                result = result.replace(/ss/g, (second || '00').padStart(2, '0'));
                
                // Xử lý 12h format
                const hour12 = parseInt(hour) % 12 || 12;
                result = result.replace(/hh/g, hour12.toString().padStart(2, '0'));
                
                // Xử lý AM/PM
                const ampm = parseInt(hour) >= 12 ? 'PM' : 'AM';
                result = result.replace(/a/g, ampm);
                
                return result;
            } catch (error) {
                return `Lỗi định dạng với pattern: ${pattern}`;
            }
        }
